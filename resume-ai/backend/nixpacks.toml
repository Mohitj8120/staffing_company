# Nixpacks configuration to support Playwright Chromium on Railway
[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/ms-playwright"

[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxcb1",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2"
]

[phases.build]
cmds = [
  "/app/.venv/bin/playwright install chromium"
]
