services:
  # 1. FastAPI Web Server
  - type: web
    name: resume-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 120675702482-22lphhribogmqk8avjlb636ao6el4j5n.apps.googleusercontent.com
      - key: SENTRY_DSN
        value: https://8e5c35bc8274c68f4633b275f64cf18d@o4511667541245952.ingest.us.sentry.io/4511667553107968
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        value: resume
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  # 2. Redis Background Queue Worker
  - type: worker
    name: resume-ai-worker
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python services/queue_worker.py
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 120675702482-22lphhribogmqk8avjlb636ao6el4j5n.apps.googleusercontent.com
      - key: SENTRY_DSN
        value: https://8e5c35bc8274c68f4633b275f64cf18d@o4511667541245952.ingest.us.sentry.io/4511667553107968
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        value: resume
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
